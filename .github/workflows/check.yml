name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.13.0' }
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-latest, node: '24' }
          - { os: macos-latest, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-e2e-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/e2e/
          if-no-files-found: ignore

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyzer-compatibility-node-${{ matrix.node }}
          path: artifacts/e2e/compatibility/
          if-no-files-found: ignore
